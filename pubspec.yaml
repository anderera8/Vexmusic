name: vexmusic
description: Vibes Player - Your music your way
publish_to: 'none'
version: 2.2.1+11

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ───────────────────────────────────────────────────────
  provider: ^6.1.1

  # ── UI / fonts ─────────────────────────────────────────────────────────────
  animated_text_kit: ^4.2.3

  # ── Persistence ────────────────────────────────────────────────────────────
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  path: ^1.9.1
  path_provider: ^2.1.3
  crypto: ^3.0.7

  # ── Permissions ────────────────────────────────────────────────────────────
  permission_handler: ^12.0.1

  # ── File picker ────────────────────────────────────────────────────────────
  file_picker: ^12.0.0-beta.7

  # ── Audio engine ───────────────────────────────────────────────────────────
  audio_session: ^0.2.3
  audio_service: ^0.18.15

  # ── Crash reporting ────────────────────────────────────────────────────────
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3
  firebase_performance: ^0.11.4+2

  # ── Stream utilities ───────────────────────────────────────────────────────
  rxdart: ^0.28.0
  meta: ^1.18.0
  share_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # ── Audio playback engine ──────────────────────────────────────────────────
  just_audio: ^0.10.5
  dynamic_color: ^1.8.1
  url_launcher: ^6.3.2

  # ── Connectivity ───────────────────────────────────────────────────────────
  # Proactive "you're offline" detection for Radio (checked before a play
  # attempt and on a live stream, in addition to the reactive network-error
  # handling already in RadioPlayerService/_friendlyMessage).
  connectivity_plus: ^7.0.0

  # ── Ads (Library/Album banners + rewarded unlocks for premium features) ────
  unity_ads_plugin: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.3
  mockito: ^5.4.4
  build_runner: ^2.4.11

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpg"
  adaptive_icon_background: "#05050D"
  adaptive_icon_foreground: "assets/app_icon.jpg"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/app_icon.jpg"
    background_color: "#05050D"
    theme_color: "#05050D"
  windows:
    generate: true
    image_path: "assets/app_icon.jpg"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/app_icon.jpg"

dependency_overrides:
  just_audio:
    path: third_party/just_audio

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.jpg